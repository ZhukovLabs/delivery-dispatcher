<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диспетчер доставки · вход</title>
<style>
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f0f3f8;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:14px;box-shadow:0 10px 34px rgba(22,32,47,.14);padding:34px 38px;width:330px;text-align:center}
.brand{font-size:30px;margin-bottom:4px}
h1{font-size:17px;margin:0 0 18px;color:#16202f}
label{display:block;text-align:left;font-size:12px;color:#5b6b80;margin:10px 0 4px}
input{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;border:1px solid #d3dae4;border-radius:9px;margin-bottom:6px}
button{width:100%;padding:11px;font-size:15px;border:0;border-radius:9px;background:#e8482b;color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
button:hover{background:#d13d22}
.err{color:#c0392b;font-size:13px;margin:0 0 4px;min-height:17px}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="brand">🛵</div>
  <h1>Диспетчер доставки</h1>
  {% if error %}<p class="err">{{ error }}</p>{% else %}<p class="err"></p>{% endif %}
  <label>Email</label>
  <input type="email" name="email" placeholder="admin@local" autofocus autocomplete="username">
  <label>Пароль</label>
  <input type="password" name="password" autocomplete="current-password">
  <button type="submit">Войти</button>
</form>
</body>
</html>
